<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOS Weather Reporter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#005a9c">
</head>
<body>
    <header>
        <div class="header-main">
            <h1>Weather Report Composer <small style="font-size: 0.5em; font-weight: normal; opacity: 0.8;">Version <span id="app-version"></span></small></h1>
            <div id="step-indicator">Step 1 of X</div>
        </div>
        <div class="language-control">
            <label id="language-label" for="language-select">Language</label>
            <select id="language-select" aria-label="Language">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="zh-Hant">繁體中文</option>
                <option value="zh-Hans">简体中文</option>
                <option value="th">ไทย</option>
            </select>
        </div>
    </header>

    <main id="app-container">
        <div id="global-preview" class="global-preview"></div>
        <!-- Dynamic Content will be injected here -->
        <div id="wizard-content"></div>
    </main>

    <footer>
        <div id="nav-buttons">
            <button id="btn-back" class="nav-btn secondary">Back</button>
            <button id="btn-skip" class="nav-btn secondary">Skip</button>
            <button id="btn-next" class="nav-btn primary">Next</button>
        </div>
    </footer>

    <!-- Cloud Chart Modal -->
    <div id="cloud-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Cloud Chart</h2>
            <div id="modal-grid" class="cloud-grid"></div>
        </div>
    </div>

    <script src="version.js"></script>
    <script>
        document.getElementById('app-version').textContent = APP_VERSION;
    </script>
    <script src="i18n.js"></script>
    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="renderers.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
                const updateCheckKey = 'vos_sw_last_update_check';
                const updateCheckInterval = 30 * 24 * 60 * 60 * 1000;
                let updateCheckInProgress = false;
                let retryAfterCurrentCheck = false;
                let alreadyControlled = Boolean(navigator.serviceWorker.controller);

                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (alreadyControlled) window.location.reload();
                    alreadyControlled = true;
                });

                async function checkForServiceWorkerUpdate(registration) {
                    if (!navigator.onLine) return;
                    if (updateCheckInProgress) {
                        retryAfterCurrentCheck = true;
                        return;
                    }

                    const lastCheck = Number(localStorage.getItem(updateCheckKey)) || 0;
                    if (Date.now() - lastCheck < updateCheckInterval) return;

                    updateCheckInProgress = true;
                    try {
                        await registration.update();
                        localStorage.setItem(updateCheckKey, String(Date.now()));
                    } catch (err) {
                        console.warn('SW update check failed; it will retry later.', err);
                    } finally {
                        updateCheckInProgress = false;
                        if (retryAfterCurrentCheck) {
                            const shouldRetry = navigator.onLine;
                            retryAfterCurrentCheck = false;
                            if (shouldRetry) checkOnReconnect();
                        }
                    }
                }

                function checkOnReconnect() {
                    navigator.serviceWorker.getRegistration()
                        .then(registration => registration || navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }))
                        .then(checkForServiceWorkerUpdate)
                        .catch(err => console.warn('SW update check failed; it will retry later.', err));
                }

                window.addEventListener('online', checkOnReconnect);
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(registration => {
                        console.log('SW registered', registration);
                        checkForServiceWorkerUpdate(registration);
                    })
                    .catch(err => console.warn('SW registration failed; it will retry when online.', err));
        }
    </script>
</body>
</html>
